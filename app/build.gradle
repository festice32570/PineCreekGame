plugins {
    id 'com.android.application'
}

android {
    namespace 'com.pinecreek.game'
    compileSdk 35
    buildToolsVersion '35.0.0'

    defaultConfig {
        applicationId 'com.pinecreek.game'
        minSdk 23
        targetSdk 35
        versionCode 9
        versionName '0.6.3'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError true
        warningsAsErrors true
        // GitHub runners may have newer SDK platforms preinstalled than this
        // project intentionally targets. Keep every other lint warning fatal.
        disable 'OldTargetApi'
    }
}