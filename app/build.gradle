plugins {
    id 'com.android.application'
}

android {
    namespace 'com.pinecreek.game'
    compileSdk 35
    buildToolsVersion '35.0.0'

    defaultConfig {
        applicationId 'com.pinecreek.game'
        minSdk 23
        targetSdk 35
        versionCode 7
        versionName '0.6.1'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
