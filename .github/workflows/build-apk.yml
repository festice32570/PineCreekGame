name: Build Pine Creek APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Vehicle and camera self-tests
        shell: bash
        run: |
          rm -rf build/logic-test
          mkdir -p build/logic-test
          javac -d build/logic-test             app/src/main/java/com/pinecreek/game/VehiclePhysics.java             app/src/main/java/com/pinecreek/game/ChaseCameraMath.java             tools/VehiclePhysicsSelfTest.java             tools/ChaseCameraMathSelfTest.java
          java -cp build/logic-test com.pinecreek.game.VehiclePhysicsSelfTest
          java -cp build/logic-test com.pinecreek.game.ChaseCameraMathSelfTest

      - name: Android SDK 35
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Restore stable debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: pine-creek-debug-keystore-v1

      - name: Create debug signing key if missing
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair               -keystore "$HOME/.android/debug.keystore"               -storepass android               -alias androiddebugkey               -keypass android               -dname "CN=Pine Creek Debug,O=Pine Creek,C=US"               -keyalg RSA               -keysize 2048               -validity 10000
          fi

      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK, package and key art
        shell: bash
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee build/apk-badging.txt
          grep -q "package: name='com.pinecreek.game'" build/apk-badging.txt
          grep -q "versionCode='7'" build/apk-badging.txt
          grep -q "versionName='0.6.1'" build/apk-badging.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump resources "$APK" | grep -q "pine_creek_keyart"
          cp "$APK" PineCreek-v0.6.1.apk
          cp docs/pine_creek_keyart.jpg pine-creek-keyart.jpg

      - name: Upload CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: PineCreekGame-v061-debug
          path: |
            PineCreek-v0.6.1.apk
            pine-creek-keyart.jpg
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[release]')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v0.6.1
          APK: PineCreek-v0.6.1.apk
          KEYART: pine-creek-keyart.jpg
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" "$KEYART" --clobber
            gh release edit "$TAG"               --title "Pine Creek v0.6.1 - Camera & Key Art Fix"               --notes-file RELEASE_NOTES.md
          else
            gh release create "$TAG" "$APK" "$KEYART"               --target "$GITHUB_SHA"               --title "Pine Creek v0.6.1 - Camera & Key Art Fix"               --notes-file RELEASE_NOTES.md
          fi
