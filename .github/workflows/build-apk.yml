name: Build Pine Creek APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Vehicle and camera self-tests
        shell: bash
        run: |
          rm -rf build/logic-test
          mkdir -p build/logic-test
          javac -encoding UTF-8 -d build/logic-test \
            app/src/main/java/com/pinecreek/game/VehiclePhysics.java \
            app/src/main/java/com/pinecreek/game/ChaseCameraMath.java \
            tools/VehiclePhysicsSelfTest.java \
            tools/ChaseCameraMathSelfTest.java
          java -cp build/logic-test com.pinecreek.game.VehiclePhysicsSelfTest
          java -cp build/logic-test com.pinecreek.game.ChaseCameraMathSelfTest

      - name: Verify source artwork files
        shell: bash
        run: |
          test -f app/src/main/res/drawable-nodpi/pine_creek_keyart.jpg
          test -f app/src/main/res/drawable-nodpi/pine_creek_icon.png
          test -f docs/pine_creek_keyart.jpg
          test -f docs/pine_creek_release.jpg
          test -f docs/pine_creek_icon.png
          test "$(stat -c%s app/src/main/res/drawable-nodpi/pine_creek_keyart.jpg)" -eq 14156
          file app/src/main/res/drawable-nodpi/pine_creek_keyart.jpg | tee build/keyart-file.txt
          grep -q "JPEG image data" build/keyart-file.txt
          grep -q "256x256" build/keyart-file.txt
          echo "54badc9d9efd5576d00befd0a788ce19b42941c94bb816662ce70164923ef0bf  app/src/main/res/drawable-nodpi/pine_creek_keyart.jpg" | sha256sum -c -
          echo "9b392ccf1abf96953ffd12d13dc375ea1f082badcd6cbefdaaf738defd58a027  app/src/main/res/drawable-nodpi/pine_creek_icon.png" | sha256sum -c -
          file app/src/main/res/drawable-nodpi/pine_creek_icon.png | tee build/icon-file.txt
          grep -q "PNG image data, 432 x 432" build/icon-file.txt
          cmp app/src/main/res/drawable-nodpi/pine_creek_keyart.jpg docs/pine_creek_keyart.jpg
          cmp app/src/main/res/drawable-nodpi/pine_creek_keyart.jpg docs/pine_creek_release.jpg
          cmp app/src/main/res/drawable-nodpi/pine_creek_icon.png docs/pine_creek_icon.png

      - name: Android SDK 35
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Restore stable debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: pine-creek-debug-keystore-v1

      - name: Create debug signing key if missing
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Pine Creek Debug,O=Pine Creek,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi

      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build and lint
        run: gradle --no-daemon :app:assembleDebug :app:lintDebug

      - name: Verify APK, package and embedded artwork
        shell: bash
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee build/apk-badging.txt
          grep -q "package: name='com.pinecreek.game'" build/apk-badging.txt
          grep -q "versionCode='9'" build/apk-badging.txt
          grep -q "versionName='0.6.3'" build/apk-badging.txt

          KEYART_ENTRY="$(zipinfo -1 "$APK" | grep -E '(^|/)pine_creek_keyart\.jpg$' | head -n 1)"
          ICON_ENTRY="$(zipinfo -1 "$APK" | grep -E '(^|/)pine_creek_icon\.png$' | head -n 1)"
          test -n "$KEYART_ENTRY"
          test -n "$ICON_ENTRY"

          EXPECTED_KEYART="$(sha256sum app/src/main/res/drawable-nodpi/pine_creek_keyart.jpg | awk '{print $1}')"
          EXPECTED_ICON="$(sha256sum app/src/main/res/drawable-nodpi/pine_creek_icon.png | awk '{print $1}')"
          unzip -p "$APK" "$KEYART_ENTRY" > build/apk-pine-creek-keyart.jpg
          unzip -p "$APK" "$ICON_ENTRY" > build/apk-pine-creek-icon.png
          APK_KEYART="$(sha256sum build/apk-pine-creek-keyart.jpg | awk '{print $1}')"
          APK_ICON="$(sha256sum build/apk-pine-creek-icon.png | awk '{print $1}')"
          test "$EXPECTED_KEYART" = "$APK_KEYART"
          test "$EXPECTED_ICON" = "$APK_ICON"
          file build/apk-pine-creek-keyart.jpg | tee build/apk-keyart-file.txt
          grep -q "JPEG image data" build/apk-keyart-file.txt
          grep -q "256x256" build/apk-keyart-file.txt

          cp "$APK" PineCreek-v0.6.3.apk
          cp docs/pine_creek_release.jpg pine-creek-keyart.jpg

      - name: Upload CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: PineCreekGame-v063-debug
          path: |
            PineCreek-v0.6.3.apk
            pine-creek-keyart.jpg
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[release]')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v0.6.3
          APK: PineCreek-v0.6.3.apk
          KEYART: pine-creek-keyart.jpg
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" "$KEYART" --clobber
            gh release edit "$TAG" \
              --title "Pine Creek v0.6.3 - Handling & QA Pass" \
              --notes-file RELEASE_NOTES.md
          else
            gh release create "$TAG" "$APK" "$KEYART" \
              --target "$GITHUB_SHA" \
              --title "Pine Creek v0.6.3 - Handling & QA Pass" \
              --notes-file RELEASE_NOTES.md
          fi

